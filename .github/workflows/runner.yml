# NeatSpace autonomous runner.
# Schedule is INTENTIONALLY commented out until you complete the supervised
# --dry-run cycle(s) and want live pinning. Enable it by uncommenting below.
name: Runner

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (never calls Pinterest)"
        type: boolean
        default: true
      fetch_budget:
        description: "Products to fetch this run"
        default: "5"
  # schedule:
  #   - cron: "0 */4 * * *"   # every 4 hours (6 runs/day)

concurrency:
  group: pin-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Run pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          TOKEN_MASTER_KEY: ${{ secrets.TOKEN_MASTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          GITHUB_BRIDGE_PAT: ${{ secrets.GITHUB_BRIDGE_PAT }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          ARGS="$ARGS --fetch-budget ${{ inputs.fetch_budget || '5' }}"
          python -m pinner.runner.main $ARGS
