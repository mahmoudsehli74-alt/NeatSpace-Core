# NeatSpace autonomous runner — LIVE (cron activated).
#
# Schedule semantics: scheduled runs receive NO dispatch inputs, so
# inputs.dry_run is empty -> the pipeline runs LIVE automatically.
# Manual dispatches keep full control (dry_run checkbox, fetch budget).
#
# Cadence rationale: every 4h (6 runs/day) with early-exit on idle keeps
# minute usage low (~1-3 min/no-op run) while letting transient failures
# recover on the next tick. Actual pin volume is capped by the governor's
# warm-up curve (2/day day 1-14), NOT by cron frequency.
name: Runner

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (never calls Pinterest)"
        type: boolean
        default: false
      fetch_budget:
        description: "Products to fetch this run"
        default: "5"
  schedule:
    - cron: "0 */4 * * *" # every 4 hours (6 runs/day, UTC)
  push:
    branches: [main]

concurrency:
  group: pin-runner
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: Run pipeline
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          TOKEN_MASTER_KEY: ${{ secrets.TOKEN_MASTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
          # Canonical BRIDGE_PAT (GitHub forbids GITHUB_-prefixed secret names);
          # accepts the legacy name as a fallback if only that exists.
          BRIDGE_PAT: ${{ secrets.BRIDGE_PAT || secrets.GITHUB_BRIDGE_PAT }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL }}
          RUNNER_INPUTS: ${{ toJSON(inputs) }}
        run: |
          # Cron-vs-dispatch semantics live in build_runner_args (tested):
          # scheduled runs carry no inputs -> LIVE automatically.
          python -c "from pinner.runner.main import cli_from_env; raise SystemExit(cli_from_env())" 
