# LIVE one-item pipeline smoke: real AliExpress discovery → real affiliate
# link → real 2:3 image → real bridge commit → ONE real Pinterest pin.
# Manual-trigger only. Prints the actual pin_id + pin_url on success.
name: Live Smoke Test

on:
  workflow_dispatch:
    inputs:
      account:
        description: "Account name (default: first ACTIVE/WARMUP)"
        default: ""
      keywords:
        description: "AliExpress search keywords"
        default: "kitchen organizer"
      board_id:
        description: "Pinterest board id (default: account's first board)"
        default: ""
      skip_pin:
        description: "Stop after bridge commit (no Pinterest call)"
        type: boolean
        default: false

concurrency:
  group: live-smoke

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MONGO_URI: ${{ secrets.MONGO_URI }}
      MONGO_DB: ${{ secrets.MONGO_DB }}
      TOKEN_MASTER_KEY: ${{ secrets.TOKEN_MASTER_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
      ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
      ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
      BRIDGE_PAT: ${{ secrets.BRIDGE_PAT || secrets.GITHUB_BRIDGE_PAT }}
      PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
      PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e .

      - name: LIVE smoke (1 item, real APIs)
        run: |
          ARGS=""
          if [ -n "${{ inputs.account }}" ]; then ARGS="$ARGS --account ${{ inputs.account }}"; fi
          if [ -n "${{ inputs.keywords }}" ]; then ARGS="$ARGS --keywords ${{ inputs.keywords }}"; fi
          if [ -n "${{ inputs.board_id }}" ]; then ARGS="$ARGS --board-id ${{ inputs.board_id }}"; fi
          if [ "${{ inputs.skip_pin }}" = "true" ]; then ARGS="$ARGS --skip-pin"; fi
          echo "invoking: python scripts/live_smoke_test.py $ARGS"
          python scripts/live_smoke_test.py $ARGS
