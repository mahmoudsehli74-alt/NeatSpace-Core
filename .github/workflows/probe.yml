# Manual-only AliExpress forensics: prints the RAW HTTP status, headers, and
# body of a real discovery request from a GitHub Actions runner IP.
# Actions -> AliExpress Probe -> Run workflow -> read the "Probe" step log.
name: AliExpress Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Probe
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ secrets.MONGO_DB }}
          TOKEN_MASTER_KEY: ${{ secrets.TOKEN_MASTER_KEY }}
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}
        run: python scripts/probe_aliexpress.py
