[project]
name = "neatspace-core"
version = "0.1.0"
description = "NeatSpace-Core: deterministic orchestrator + ADK agents for autonomous affiliate pinning"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pymongo>=4.8",
    "python-dotenv>=1.0",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pinner*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
